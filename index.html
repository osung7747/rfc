<style>
/* VOICE: 시끄럽고 신나는 격투 대회 중계
   IDEA: 팔각 케이지 안 1인칭 시점, 대회 그래픽 같은 HUD
   PICTURE: 친구 얼굴을 얹은 2등신 선수와 케이지
   COLOUR and TYPE: 검정 무대, RFC 레드, 챔피언 골드 / Anton + Black Han Sans
   LAYOUT: 390x844 무대를 화면에 맞춰 확대·축소 */
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:#f4f5f8}
#stage{position:absolute;left:50%;top:50%;width:390px;height:844px;overflow:hidden;background:#0b0d14;transform-origin:50% 50%}
#world{position:absolute;inset:0}
.layer{position:absolute;left:0;top:0;width:390px;height:844px}
#opp{position:absolute;left:0;top:0;width:390px;height:844px;transition:transform .35s ease}
#opp:not(.champ) .belt{display:none}
#oppHead{position:absolute;left:57px;width:280px;height:280px;transform-origin:140px 268px}
.oglove{position:absolute;left:0;top:0;width:120px;height:130px;transform-origin:60px 58px;will-change:transform}
.pglove{position:absolute;top:530px;width:240px;height:240px;transform-origin:120px 110px}
#pgL{left:-50px}#pgR{left:200px}
.head{position:relative;width:280px;height:280px}
.hi{position:absolute;left:0;top:0;width:280px;height:280px;filter:drop-shadow(0 10px 10px #000)}
.sh{position:absolute;left:0;top:0;width:280px;height:280px;mix-blend-mode:multiply}
.sh2{position:absolute;left:0;top:0;width:280px;height:280px;mix-blend-mode:screen}
.hl{background:radial-gradient(ellipse 18% 12% at 38% 46%,#5a4a40 0%,#000 100%)!important;opacity:.55}
.st0 .b1,.st0 .b2,.st0 .b3,.st1 .b2,.st1 .b3,.st2 .b3{display:none}
.shade-h1{-webkit-mask-image:url(heads/h1.png);mask-image:url(heads/h1.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;background:radial-gradient(ellipse 46% 40% at 46% 66%,#fff 0%,#fff 55%,#c9a58f 82%,#6b4636 100%)}
.mask-h1{-webkit-mask-image:url(heads/h1.png);mask-image:url(heads/h1.png);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.shade-h2{-webkit-mask-image:url(heads/h2.png);mask-image:url(heads/h2.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;background:radial-gradient(ellipse 46% 40% at 46% 66%,#fff 0%,#fff 55%,#c9a58f 82%,#6b4636 100%)}
.mask-h2{-webkit-mask-image:url(heads/h2.png);mask-image:url(heads/h2.png);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.shade-h3{-webkit-mask-image:url(heads/h3.png);mask-image:url(heads/h3.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;background:radial-gradient(ellipse 46% 40% at 46% 66%,#fff 0%,#fff 55%,#c9a58f 82%,#6b4636 100%)}
.mask-h3{-webkit-mask-image:url(heads/h3.png);mask-image:url(heads/h3.png);-webkit-mask-size:100% 100%;mask-size:100% 100%}

.fx{position:absolute;left:0;top:0;width:140px;height:140px;opacity:0;pointer-events:none}
#hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(200,16,46,0) 40%,rgba(200,16,46,.75) 100%)}
#pop{position:absolute;left:0;right:0;text-align:center;font-family:'Black Han Sans',sans-serif;font-size:34px;opacity:0;pointer-events:none;text-shadow:0 3px 0 #000}
#banner{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:'Anton',sans-serif;font-size:72px;letter-spacing:3px;color:#ffc93c;text-shadow:0 5px 0 #b4201a,0 10px 30px #000;opacity:0;pointer-events:none;font-style:italic}
#banner.kr{font-family:'Black Han Sans',sans-serif;font-style:normal}
/* HUD */
#hud{position:absolute;left:0;top:0;width:390px;padding:16px 14px 0;display:flex;align-items:center;gap:8px}
.side{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.side.r{align-items:flex-end}
.nm{font-size:15px;font-weight:900;text-shadow:0 2px 0 #000;display:flex;gap:6px;align-items:baseline;padding:0 4px;white-space:nowrap}
.nm small{font-size:11px;font-weight:700}
.bar{height:20px;width:100%;border:2px solid #05070c;border-radius:4px;background:#1a1f2e;box-shadow:0 3px 0 #05070c,inset 0 3px 6px #000;overflow:hidden;display:flex}
.side:not(.r) .bar{transform:skewX(-16deg)}
.side.r .bar{transform:skewX(16deg);justify-content:flex-end}
.fill{height:100%;transition:width .25s}
#bP{background:linear-gradient(180deg,#a9cbff 0%,#3d7ef0 45%,#1c4aa8 100%)}
#bO{background:linear-gradient(180deg,#ffd0a0 0%,#f5892c 45%,#b4520f 100%)}
.hp{font-family:'Black Han Sans',sans-serif;font-size:14px;padding:0 4px;text-shadow:0 2px 0 #000}
#clock{width:64px;height:64px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(180deg,#2c3348 0%,#12151f 100%);border:2px solid #ffc93c;box-shadow:0 4px 0 #05070c}
#rnd{font-size:9px;font-weight:900;color:#c9d2e8;letter-spacing:1px}
#tm{font-family:'Black Han Sans',sans-serif;font-size:24px;color:#ffc93c;line-height:1.05}
#champTag{font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;background:linear-gradient(180deg,#fff1a8,#ffc93c 55%,#b37a08);color:#3a2600}
/* controls */
#ctrl{position:absolute;left:10px;right:10px;bottom:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border-radius:20px;background:linear-gradient(180deg,#1d2233 0%,#0b0e16 100%);border:1px solid #3a4260;box-shadow:0 4px 0 #05070c}
.cb{height:76px;border-radius:16px;font-family:'Noto Sans KR',sans-serif;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none}
.cb:active{transform:translateY(3px)}
.cg{border:2px solid #6b9bf0;background:linear-gradient(180deg,#2a4a8c 0%,#142650 100%);color:#e1ecff;font-size:12px;box-shadow:0 4px 0 #08142e}
.cp{border:0;background:linear-gradient(180deg,#ffe08a 0%,#ffc93c 55%,#d99a12 100%);color:#151821;font-size:14px;box-shadow:0 4px 0 #8a5c00}
.cb:focus-visible,.btn:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* screens */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:22px 16px 24px;gap:12px;background:radial-gradient(ellipse at 50% 0%,#232a40 0%,#0b0d14 60%);overflow:hidden}
.scr.on{display:flex}
.scr h1{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:28px;text-shadow:0 3px 0 #000}
.scr p{margin:0}
.sub{font-size:13px;color:#c9d2e8;text-align:center}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:10px;border-radius:20px;cursor:pointer;font-family:inherit;color:inherit;text-align:left;background:linear-gradient(180deg,#1d2233 0%,#0f121b 100%);border:3px solid #2c3348;box-shadow:0 5px 0 #05070c}
.card.sel{background:linear-gradient(180deg,#2c3350 0%,#161a28 100%);border-color:#ffc93c;box-shadow:0 0 0 4px rgba(255,201,60,.18),0 5px 0 #05070c}
.cimg{width:118px;height:140px;flex:none;position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(ellipse at 50% 35%,#3a4566 0%,#161b2a 75%)}
.cimg .thumb{position:absolute;left:-28px;top:-34px}
.cname{font-family:'Black Han Sans',sans-serif;font-size:24px}
.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px}
.blue{background:linear-gradient(180deg,#2a4a8c,#162a55);color:#e1ecff;border:1px solid #3d64b8}
.green{background:linear-gradient(180deg,#2f6b4a,#173826);color:#dcf5e6;border:1px solid #3f8f63}
.orange{background:linear-gradient(180deg,#8a4520,#4f230c);color:#ffe6d6;border:1px solid #c2652e}
.stats{display:grid;grid-template-columns:36px minmax(0,1fr);row-gap:6px;align-items:center;width:100%;font-size:12px}
.stats b{color:#c9d2e8}
.seg{display:flex;gap:4px}.seg i{width:26px;height:10px;border-radius:3px;background:#2a3044}
.seg.r i.on{background:#6b9bf0}.seg.p i.on{background:#f08a2c}
.btn{width:100%;height:60px;border:0;border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Black Han Sans',sans-serif;font-size:20px;color:#151821;background:linear-gradient(180deg,#ffe08a 0%,#ffc93c 55%,#d99a12 100%);box-shadow:0 5px 0 #8a5c00}
.btn.fight{font-family:'Anton',sans-serif;font-style:italic;font-size:34px;letter-spacing:3px;color:#fff;background:linear-gradient(180deg,#ff5a6a 0%,#c8102e 55%,#7d0a1c 100%);box-shadow:0 5px 0 #4a0510,inset 0 2px 0 #ff9aa6}
.btn.dark{color:#e6e9f0;background:linear-gradient(180deg,#2c3348 0%,#151a28 100%);border:2px solid #3a4260;box-shadow:0 4px 0 #05070c}
.btn.kakao{background:#fee500;color:#191919;box-shadow:0 5px 0 #8f8100;font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:17px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.big{font-family:'Black Han Sans',sans-serif;font-size:40px;text-shadow:0 4px 0 #000;text-align:center;line-height:1.1}
.ko{font-family:'Black Han Sans',sans-serif;font-size:86px;line-height:1;color:#ffc93c;transform:rotate(-6deg);text-shadow:0 6px 0 #b4201a,0 10px 24px #000}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.tri div{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:#151a28;border:1px solid #2c3348}
.tri b{font-family:'Black Han Sans',sans-serif;font-size:26px;color:#ffc93c}.tri span{font-size:12px;color:#c9d2e8}
.thumb{position:relative;overflow:visible}
.stars{position:absolute;left:50%;top:6%;width:70%;height:40%;transform:translateX(-50%);animation:dz 3s linear infinite}
@keyframes dz{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}
.vs{font-family:'Anton',sans-serif;font-style:italic;font-size:64px;color:#c8102e;text-shadow:0 4px 0 #000}
#toast{position:absolute;left:20px;right:20px;bottom:120px;padding:12px 14px;border-radius:14px;background:#151a28;border:1px solid #3a4260;font-size:14px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#modal{position:absolute;inset:0;background:rgba(5,7,12,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#modal.on{display:flex}
#modal img{width:300px;height:300px;border-radius:16px;border:2px solid #3a4260}
#pause{position:absolute;inset:0;background:rgba(5,7,12,.8);display:none;align-items:center;justify-content:center;padding:40px}
#pause.on{display:flex}
@media (prefers-reduced-motion:reduce){.stars{animation:none}}
</style>
</head>

  const L = LV[S.dist], g = CH[S.opp].geom, o = $('opp');

}

function faceAt(side) { const g = CH[S.opp].geom, sg = side === 'L' ? -1 : 1; return toScreen(197 + sg * 42, g.top + 190); }

/* ---------- HUD ---------- */

}

/* ---------- 연출 ---------- */
function place(el, x, y) { el.style.left = (x - 70) + 'px'; el.style.top = (y - 70) + 'px'; }
function popTxt(text, color, y) { const el = $('pop'); el.textContent = text; el.style.color = color; el.style.top = (y || 300) + 'px';
  el.animate([{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'scale(1.1)', offset: .25 }, { opacity: 1, transform: 'scale(1)', offset: .7 }, { opacity: 0, transform: 'translateY(-14px)' }], { duration: 650, easing: 'ease-out' }); }
function shake(p) { $('world').animate([{ transform: 'none' }, { transform: 'translate(' + (-p) + 'px,' + (p / 2) + 'px)' }, { transform: 'translate(' + p + 'px,' + (-p / 2) + 'px)' }, { transform: 'translate(' + (-p / 2) + 'px,' + (p / 3) + 'px)' }, { transform: 'none' }], { duration: 260 }); }

  sp.animate([{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1.1)', offset: .25 }, { opacity: 1, transform: 'scale(1)', offset: .7 }, { opacity: 0, transform: 'scale(1.25)' }], { duration: 400, easing: 'ease-out' });
  const d = side === 'R' ? -1 : 1; // 오른손에 맞으면 화면 왼쪽으로
  $('oppHead').animate([{ transform: 'none' }, { transform: 'translateX(' + 24 * d + 'px) rotate(' + 15 * d + 'deg)', offset: .22 }, { transform: 'translateX(' + (-7 * d) + 'px) rotate(' + (-4 * d) + 'deg)', offset: .52 }, { transform: 'translateX(' + 3 * d + 'px) rotate(' + 2 * d + 'deg)', offset: .74 }, { transform: 'none' }], { duration: 450, easing: 'ease-out' });

}
function ringAt(x, y) { const r = $('ring'); place(r, x, y); r.animate([{ opacity: .95, transform: 'scale(.3)' }, { opacity: 0, transform: 'scale(1.7)' }], { duration: 400, easing: 'ease-out' }); }
function blockFx(side) { sfx('block'); const f = faceAt(side); ringAt(f.x, f.y); popTxt('막힘!', '#bfe0ff', f.y - 110); }

function animPunch(side) {

  el.animate([{ transform: 'none' }, { transform: 'translate(' + (f.x - o.x) + 'px,' + (f.y - o.y) + 'px) scale(.42)', offset: .38 }, { transform: 'none' }], { duration: 320, easing: 'ease-out' });

  el.animate([{ transform: 'none' }, { transform: 'translate(' + dx + 'px,-200px) scale(.95)', offset: .2 }, { transform: 'translate(' + dx + 'px,-200px) scale(.95)', offset: .6 }, { transform: 'none' }], { duration: 800, easing: 'ease-in-out' });

  setTimeout(() => { try { cb && cb(); } catch (e) { toast('문제가 생겼어요: ' + e.message); } }, ms);

/* ---------- 전투 ---------- */
function decide() {
  const c = CH[S.opp], O = S.o;
  if (Math.random() < .42) {
    let d = S.dist;
    if (Math.random() < .65) d += Math.sign(c.pref - S.dist) || (Math.random() < .5 ? -1 : 1); else d += Math.random() < .5 ? -1 : 1;
    if (d < 0) d = 1; if (d > 3) d = 2;
    setDist(d); O.t = rnd(.35, .6); return;
  }
  if (S.dist >= c.reach && Math.random() < .8) {
    O.st = 'windup'; O.side = Math.random() < .5 ? 'L' : 'R'; O.t = (S.champ ? .5 : .62) * rnd(.9, 1.15);
    setPose(O.side, 'windup', 9); setPose(O.side === 'L' ? 'R' : 'L', 'guard', 12); return;
  }
  if (S.dist < c.reach) { setDist(S.dist + 1); O.t = rnd(.35, .6); return; }
  O.t = rnd(.4, .9);
}
function impact() {
  const O = S.o, P = S.p, c = CH[S.opp];
  if (S.dist < c.reach) return;
  if (P.gT > 0 && P.gSide === O.side) { S.stats.blocks++; guardFx(O.side); return; }
  S.hpP = Math.max(0, S.hpP - c.power); S.stats.combo = 0; P.stun = .3; sfx('hurt'); buzz(60); hurtFx();
  if (S.hpP <= 0) ko(false);
}
function resolvePunch(side) {
  const O = S.o, c = CH[S.ply];
  if (!S.active) return;
  if (S.dist < c.reach) { sfx('whiff'); popTxt('헛손질!', '#c9d2e8', 300); return; }
  O.hist.push(side); if (O.hist.length > 6) O.hist.shift();
  if (O.st === 'block' && O.side === side) { blockFx(side); return; }
  if (O.st === 'idle' || O.st === 'stun' || O.st === 'block') {
    let rep = 0; for (let i = O.hist.length - 2; i >= 0 && O.hist[i] === side; i--) rep++;
    const pb = Math.min(.75, (S.champ ? .36 : .26) + rep * .17);
    if (Math.random() < pb) { O.st = 'block'; O.side = side; O.t = .34; setPose(side, 'block', 32); setPose(side === 'L' ? 'R' : 'L', 'guard', 12); blockFx(side); return; }
  }
  S.hpO = Math.max(0, S.hpO - c.power); S.stats.hits++; S.stats.combo++; S.stats.max = Math.max(S.stats.max, S.stats.combo);
  sfx('hit'); buzz(30); hitFx(side);
  setPose('L', 'guard', 12); setPose('R', 'guard', 12);
  O.st = 'stun'; O.t = .36;
  if (S.hpO <= 0) ko(true);
}
function tick(dt) {
  const P = S.p, O = S.o;
  S.time -= dt;
  if (S.time <= 0) { S.time = 0; hud(); roundEnd(); return; }
  P.busy = Math.max(0, P.busy - dt); P.stun = Math.max(0, P.stun - dt); P.gT = Math.max(0, P.gT - dt);
  if (P.pend) { P.pend.t -= dt; if (P.pend.t <= 0) { const sd = P.pend.side; P.pend = null; resolvePunch(sd); if (!S.active) return; } }
  O.t -= dt;
  if (O.st === 'idle') { if (O.t <= 0) decide(); }
  else if (O.st === 'windup') { if (O.t <= 0) { O.st = 'strike'; O.t = .17; O.imp = false; setPose(O.side, 'strike', 30); } }
  else if (O.st === 'strike') { if (!O.imp && O.t <= .08) { O.imp = true; impact(); if (!S.active) return; } if (O.t <= 0) { O.st = 'recover'; O.t = .5; setPose(O.side, 'guard', 9); } }
  else if (O.st === 'recover') { if (O.t <= 0) { O.st = 'idle'; O.t = rnd(.35, .8); } }
  else if (O.st === 'block') { if (O.t <= 0) { O.st = 'idle'; O.t = rnd(.3, .6); setPose(O.side, 'guard', 12); } }
  else if (O.st === 'stun') { if (O.t <= 0) { O.st = 'idle'; O.t = rnd(.3, .6); } }

}
let last = 0;
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  try { if (S.active) tick(dt); stepGloves(dt); } catch (e) { S.active = false; toast('문제가 생겼어요: ' + e.message); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function act(a) {
  unlock();
  if (!S.active) return;
  const P = S.p; if (P.busy > 0 || P.stun > 0) return;
  const side = a[1];
  if (a[0] === 'p') { P.busy = .5; P.pend = { side: side, t: .11 }; animPunch(side); }
  else { P.busy = .8; P.gSide = side; P.gT = .42; animGuard(side); }
}

}

/* ---------- 라운드·KO ---------- */

      '<button type="button" class="btn kakao" id="rsShare" style="margin-top:auto">카톡으로 결과 보내기</button>' +
      '<div class="row2"><button type="button" class="btn" id="rsRetry">다시 도전</button><button type="button" class="btn dark" id="rsSel">캐릭터 선택</button></div>';
    lastShare = { title: O.name + ' 승리', sub: josa(P.name, '이', '가') + ' ' + (how === 'ko' ? 'KO' : '판정') + '로 졌다', win: S.opp, lose: S.ply, crown: S.champ };
  }
  scr.innerHTML = h; show('scrResult');
  const on = (id, f) => { const b = $(id); if (b) b.addEventListener('click', f); };
  on('rsNext', () => { S.fight = 2; startFight(); });
  on('rsRetry', () => startFight());
  on('rsAgain', () => startTournament());
  on('rsSel', () => { buildCards(); show('scrSelect'); });
  on('rsShare', shareResult);
}

/* ---------- 결과 공유 ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function makeImage() {
  const r = lastShare, c = document.createElement('canvas'); c.width = 1080; c.height = 1080; const x = c.getContext('2d');
  const bg = x.createRadialGradient(540, 300, 50, 540, 540, 800); bg.addColorStop(0, '#2a3150'); bg.addColorStop(1, '#0b0d14'); x.fillStyle = bg; x.fillRect(0, 0, 1080, 1080);
  x.fillStyle = '#c8102e'; x.beginPath(); x.moveTo(380, 60); x.lineTo(740, 60); x.lineTo(700, 160); x.lineTo(340, 160); x.closePath(); x.fill();
  x.fillStyle = '#fff'; x.font = 'italic 84px Anton, sans-serif'; x.textAlign = 'center'; x.fillText('RFC', 540, 145);
  const w = await loadImg('heads/' + CH[r.win].head + '.png'), l = await loadImg('heads/' + CH[r.lose].head + '.png');
  x.save(); x.translate(230, 760); x.rotate(-0.42); x.globalAlpha = .85; x.drawImage(l, -200, -200, 400, 400); x.restore();
  x.drawImage(w, 300, 170, 560, 560);
  x.fillStyle = '#ffc93c'; x.font = '84px "Black Han Sans", sans-serif'; x.fillText(r.title, 540, 880);
  x.fillStyle = '#e6e9f0'; x.font = '46px "Black Han Sans", sans-serif'; x.fillText(r.sub, 540, 960);
  x.fillStyle = '#9aa4bd'; x.font = '32px "Noto Sans KR", sans-serif'; x.fillText('ROOKIES FIGHT CHAMPIONSHIP', 540, 1030);
  return c;
}
async function shareResult() {
  try {
    const c = await makeImage(), text = 'RFC ' + lastShare.title + ' - ' + lastShare.sub;
    const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
    const file = new File([blob], 'rfc-result.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text: text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    $('shareImg').src = c.toDataURL('image/png'); $('modal').classList.add('on');
    $('copyTxt').onclick = async () => { try { await navigator.clipboard.writeText(text + ' ' + location.href.split('#')[0]); toast('결과 문구를 복사했어요'); } catch (e) { toast('복사가 막혀 있어요. 이미지를 저장해서 보내 주세요'); } };
  } catch (e) { toast('결과 이미지를 만들지 못했어요: ' + e.message); }
}
$('closeModal').addEventListener('click', () => $('modal').classList.remove('on'));

/* ---------- 일시정지 ---------- */
document.addEventListener('visibilitychange', () => { if (document.hidden && S.active) { S.active = false; $('pause').classList.add('on'); } });
$('resume').addEventListener('click', () => { unlock(); $('pause').classList.remove('on'); S.active = true; });

buildCards();
}
</script>
